services:
  - type: web
    name: medisense
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    # No preDeployCommand: Render rejects the whole deploy if it is set on a
    # free-plan service. Run migrations from a local checkout instead:
    #   npm run db:migrate
    # which points at the same Supabase database.
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: APP_NAME
        value: MediSense
      # Supabase session pooler, not the transaction pooler (no session, so
      # the DDL a migration needs cannot run against it).
      # Host: aws-0-<region>.pooler.supabase.com, port 5432
      # User: postgres.<project-ref>  (a bare "postgres" is rejected)
      - key: DATABASE_URL
        sync: false
      # Render free plan runs one instance. Keep the pool at 1 so the app never
      # exceeds Supabase's connection allowance.
      - key: DATABASE_POOL_MAX
        value: 1
      - key: AUTH_SECRET
        sync: false
      # Set this to the deployed origin after the first deploy, otherwise origin
      # checks reject your own requests.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: 10485760
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: RATE_LIMIT_REQUESTS
        value: 60
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: MIGRATIONS_DIR
        value: ./src/database/migrations
      # Render's filesystem is ephemeral, so every uploaded PDF is lost when the
      # instance restarts or redeploys. Add the S3_* vars (private bucket) to
      # make uploads durable.
      - key: STORAGE_LOCAL_DIR
        value: ./.uploads
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: EMBEDDING_PROVIDER
        value: mock
      - key: OCR_PROVIDER
        value: mock
      - key: SAFETY_ENGINE_ENABLED
        value: true
      - key: CLINICAL_RULES_MODE
        value: enforce
